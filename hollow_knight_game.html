<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свалище Мешков - Hollow Knight Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 3px solid #4a4a6a;
            border-radius: 5px;
        }
        #gameCanvas {
            display: block;
            background: #2d3a2d;
        }
        #ui {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #credits {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #c0c0c0;
            font-size: 24px;
            z-index: 100;
        }
        #credits h2 {
            color: #8fbc8f;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .credit-line {
            margin: 15px 0;
            opacity: 0;
            animation: fadeInOut 4s ease-in-out forwards;
        }
        .credit-line:nth-child(2) { animation-delay: 0.5s; }
        .credit-line:nth-child(3) { animation-delay: 2s; }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 100;
        }
        #startScreen h1 {
            color: #8fbc8f;
            font-size: 36px;
            margin-bottom: 20px;
        }
        #startScreen p {
            margin: 10px 0;
            color: #aaa;
        }
        #startBtn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background: #4a6741;
            color: #fff;
            border: 2px solid #6b8c5e;
            cursor: pointer;
            border-radius: 5px;
        }
        #startBtn:hover {
            background: #5d7f52;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        <div id="ui"></div>
        <div id="credits">
            <h2>Титры</h2>
            <div class="credit-line">Промтник - Александр Гугучкин</div>
            <div class="credit-line">Создатель - Qwen</div>
        </div>
        <div id="startScreen">
            <h1>СВАЛИЩЕ МЕШКОВ</h1>
            <p>WASD или Стрелки - Движение</p>
            <p>Пробел - Прыжок</p>
            <p>Z - Атака</p>
            <p>Выживи на арене!</p>
            <button id="startBtn">НАЧАТЬ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const credits = document.getElementById('credits');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');

        // Игровые константы
        const GRAVITY = 0.6;
        const FRICTION = 0.85;
        const GROUND_Y = 680;

        // Состояние игры
        let gameState = 'start'; // start, playing, credits
        let wave = 1;
        let bagsSpawned = 0;
        let enemiesDefeated = 0;
        let totalEnemiesInWave = 0;

        // Главный герой - Ворт
        const player = {
            name: "Ворт",
            x: 512,
            y: 600,
            width: 40,
            height: 70,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpForce: -14,
            grounded: false,
            facing: 1,
            attacking: false,
            attackTimer: 0,
            health: 100,
            maxHealth: 100,
            cloakColor: '#3d5c3d'
        };

        // Массивы объектов
        let bags = [];
        let enemies = [];
        let projectiles = [];
        let particles = [];

        // Управление
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            startGame();
        });

        function startGame() {
            gameState = 'playing';
            resetArena();
            gameLoop();
        }

        function resetArena() {
            player.x = 512;
            player.y = 600;
            player.vx = 0;
            player.vy = 0;
            player.health = player.maxHealth;
            
            bags = [];
            enemies = [];
            projectiles = [];
            particles = [];
            
            wave = 1;
            bagsSpawned = 0;
            enemiesDefeated = 0;
            totalEnemiesInWave = 0;
        }

        // Класс Мешок
        class Bag {
            constructor(x, y) {
                this.name = "мешок";
                this.x = x;
                this.y = y;
                this.radius = 35;
                this.vy = 0;
                this.grounded = false;
                this.opened = false;
                this.openTimer = 0;
                this.color = '#2d4a2d';
                this.patchColor = '#6a6a6a';
            }

            update() {
                if (!this.grounded) {
                    this.vy += GRAVITY;
                    this.y += this.vy;
                    
                    if (this.y + this.radius >= GROUND_Y) {
                        this.y = GROUND_Y - this.radius;
                        this.vy = 0;
                        this.grounded = true;
                        this.openTimer = 30;
                    }
                } else if (!this.opened) {
                    this.openTimer--;
                    if (this.openTimer <= 0) {
                        this.opened = true;
                        this.spawnEnemy();
                    }
                }
            }

            spawnEnemy() {
                const enemyType = Math.random() < 0.6 ? 'crawler' : 'flyer';
                if (enemyType === 'crawler') {
                    enemies.push(new Crawler(this.x, this.y - 20));
                } else {
                    enemies.push(new Flyer(this.x, this.y - 50));
                }
                totalEnemiesInWave++;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Тело мешка - круглое, тёмно-зелёное
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#1a2e1a';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Серые заплатки
                ctx.fillStyle = this.patchColor;
                ctx.beginPath();
                ctx.arc(-15, -10, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(18, 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, 18, 9, 0, Math.PI * 2);
                ctx.fill();
                
                // Швы на заплатках
                ctx.strokeStyle = '#4a4a4a';
                ctx.lineWidth = 2;
                [-15, -10].forEach(([cx, cy]) => {
                    ctx.beginPath();
                    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
                    ctx.stroke();
                });
                
                // Эффект открытия
                if (this.opened) {
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.ellipse(0, -5, 20, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }

        // Ползущий враг
        class Crawler {
            constructor(x, y) {
                this.name = "ползущий враг";
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 20;
                this.vx = Math.random() < 0.5 ? -2 : 2;
                this.vy = 0;
                this.speed = 1.5;
                this.health = 20;
                this.damage = 10;
                this.color = '#4a5c4a';
                this.animFrame = 0;
            }

            update() {
                this.vy += GRAVITY;
                this.y += this.vy;
                
                if (this.y + this.height >= GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.vy = 0;
                }
                
                this.x += this.vx;
                
                // Отскок от стен арены
                if (this.x <= 100 || this.x >= canvas.width - 100) {
                    this.vx *= -1;
                }
                
                // Движение к игроку если близко
                const dx = player.x - this.x;
                if (Math.abs(dx) < 200 && Math.abs(player.y - this.y) < 100) {
                    this.vx = dx > 0 ? this.speed : -this.speed;
                }
                
                this.animFrame++;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Тело
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 10, 15, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Ноги
                const legOffset = Math.sin(this.animFrame * 0.3) * 5;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                for (let i = 0; i < 6; i++) {
                    const lx = -10 + i * 4;
                    const ly = 10 + (i % 2 === 0 ? legOffset : -legOffset);
                    ctx.beginPath();
                    ctx.moveTo(lx, 5);
                    ctx.lineTo(lx, ly + 15);
                    ctx.stroke();
                }
                
                // Глаза
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(-5, 5, 3, 0, Math.PI * 2);
                ctx.arc(5, 5, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Летающий враг
        class Flyer {
            constructor(x, y) {
                this.name = "летающий враг";
                this.x = x;
                this.y = y;
                this.width = 25;
                this.height = 25;
                this.vx = 0;
                this.vy = 0;
                this.speed = 2;
                this.health = 15;
                this.damage = 8;
                this.color = '#5a6c5a';
                this.animFrame = 0;
                this.targetY = y;
            }

            update() {
                this.animFrame++;
                
                // Парение
                this.targetY = GROUND_Y - 100 - Math.sin(this.animFrame * 0.05) * 50;
                this.vy = (this.targetY - this.y) * 0.05;
                this.y += this.vy;
                
                // Движение к игроку
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 50) {
                    this.vx = (dx / dist) * this.speed;
                } else {
                    this.vx *= 0.95;
                }
                
                this.x += this.vx;
                
                // Ограничение по горизонтали
                if (this.x < 100) this.x = 100;
                if (this.x > canvas.width - 100) this.x = canvas.width - 100;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Тело
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Крылья
                const wingAngle = Math.sin(this.animFrame * 0.5) * 0.5;
                ctx.fillStyle = '#6a7c6a';
                ctx.save();
                ctx.rotate(-wingAngle);
                ctx.beginPath();
                ctx.ellipse(-8, -5, 10, 5, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                ctx.save();
                ctx.rotate(wingAngle);
                ctx.beginPath();
                ctx.ellipse(8, -5, 10, 5, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                // Глаза
                ctx.fillStyle = '#ff8b8b';
                ctx.beginPath();
                ctx.arc(-4, 0, 2, 0, Math.PI * 2);
                ctx.arc(4, 0, 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Босс - Драная Легкомаска
        class Lightmask {
            constructor() {
                this.name = "драная легкомаска";
                this.x = canvas.width / 2;
                this.y = 200;
                this.width = 60;
                this.height = 80;
                this.vx = 0;
                this.vy = 0;
                this.speed = 3;
                this.health = 100;
                this.maxHealth = 100;
                this.damage = 15;
                this.cloakColor = '#3d5c3d';
                this.patchColor = '#6a6a6a';
                this.maskColor = '#8fbc8f';
                this.animFrame = 0;
                this.phase = 'enter'; // enter, fight
                this.enterTimer = 60;
                this.attackTimer = 0;
                this.currentAttack = null;
            }

            update() {
                this.animFrame++;
                
                if (this.phase === 'enter') {
                    this.enterTimer--;
                    this.y += 3;
                    if (this.enterTimer <= 0) {
                        this.phase = 'fight';
                        this.y = 200;
                    }
                    return;
                }
                
                // Парение
                this.targetY = 200 + Math.sin(this.animFrame * 0.03) * 30;
                this.vy = (this.targetY - this.y) * 0.03;
                this.y += this.vy;
                
                // Движение
                const dx = player.x - this.x;
                this.vx = (dx / Math.abs(dx)) * this.speed * 0.5;
                this.x += this.vx;
                
                // Ограничения
                if (this.x < 150) this.x = 150;
                if (this.x > canvas.width - 150) this.x = canvas.width - 150;
                
                // Атаки
                this.attackTimer--;
                if (this.attackTimer <= 0) {
                    this.performAttack();
                }
            }

            performAttack() {
                const attacks = ['dash', 'projectile', 'dive'];
                this.currentAttack = attacks[Math.floor(Math.random() * attacks.length)];
                
                switch(this.currentAttack) {
                    case 'dash':
                        this.vx = (player.x - this.x) > 0 ? 8 : -8;
                        this.attackTimer = 90;
                        break;
                    case 'projectile':
                        projectiles.push({
                            x: this.x,
                            y: this.y + 30,
                            vx: (player.x - this.x) * 0.05,
                            vy: (player.y - this.y) * 0.05,
                            damage: 10
                        });
                        this.attackTimer = 60;
                        break;
                    case 'dive':
                        this.vy = 10;
                        this.attackTimer = 120;
                        break;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Накидка (тёмно-зелёная с заплатками)
                ctx.fillStyle = this.cloakColor;
                ctx.beginPath();
                ctx.moveTo(0, -40);
                ctx.quadraticCurveTo(-25, 0, -30, 40);
                ctx.quadraticCurveTo(-15, 50, 0, 45);
                ctx.quadraticCurveTo(15, 50, 30, 40);
                ctx.quadraticCurveTo(25, 0, 0, -40);
                ctx.fill();
                
                // Заплатки на накидке
                ctx.fillStyle = this.patchColor;
                ctx.beginPath();
                ctx.arc(-15, 10, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(18, 15, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, 30, 9, 0, Math.PI * 2);
                ctx.fill();
                
                // Ромбная маска
                ctx.fillStyle = this.maskColor;
                ctx.beginPath();
                ctx.moveTo(0, -35);
                ctx.lineTo(-15, -20);
                ctx.lineTo(0, -5);
                ctx.lineTo(15, -20);
                ctx.closePath();
                ctx.fill();
                
                // Глаза маски
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-5, -18, 4, 6, -0.2, 0, Math.PI * 2);
                ctx.ellipse(5, -18, 4, 6, 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        let boss = null;
        let bossSpawned = false;

        function spawnBag() {
            const x = 150 + Math.random() * (canvas.width - 300);
            bags.push(new Bag(x, -50));
            bagsSpawned++;
        }

        function checkCollisions() {
            // Игрок с врагами
            enemies.forEach((enemy, index) => {
                if (rectCollision(player, enemy)) {
                    player.health -= enemy.damage * 0.05;
                }
            });
            
            // Атака игрока
            if (player.attacking) {
                const attackRange = {
                    x: player.x + (player.facing * 40),
                    y: player.y,
                    width: 50,
                    height: 40
                };
                
                enemies.forEach((enemy, index) => {
                    if (rectCollision(attackRange, enemy)) {
                        enemy.health -= 25;
                        if (enemy.health <= 0) {
                            enemies.splice(index, 1);
                            enemiesDefeated++;
                            createParticles(enemy.x, enemy.y, enemy.color);
                        }
                    }
                });
                
                if (boss && rectCollision(attackRange, boss)) {
                    boss.health -= 2;
                    if (boss.health <= 0) {
                        boss = null;
                        victory();
                    }
                }
            }
            
            // Снаряды босса
            projectiles.forEach((proj, index) => {
                proj.x += proj.vx;
                proj.y += proj.vy;
                
                if (rectCollision(proj, player)) {
                    player.health -= proj.damage;
                    projectiles.splice(index, 1);
                }
                
                if (proj.x < 0 || proj.x > canvas.width || proj.y < 0 || proj.y > canvas.height) {
                    projectiles.splice(index, 1);
                }
            });
        }

        function rectCollision(a, b) {
            const aLeft = a.x - (a.width || 0) / 2;
            const aRight = a.x + (a.width || 0) / 2;
            const aTop = a.y - (a.height || 0) / 2;
            const aBottom = a.y + (a.height || 0) / 2;
            
            const bLeft = b.x - (b.width || b.radius || 0);
            const bRight = b.x + (b.width || b.radius || 0);
            const bTop = b.y - (b.height || b.radius || 0);
            const bBottom = b.y + (b.height || b.radius || 0);
            
            return !(aLeft > bRight || aRight < bLeft || aTop > bBottom || aBottom < bTop);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 30,
                    color: color
                });
            }
        }

        function updatePlayer() {
            // Движение
            if (keys['KeyA'] || keys['ArrowLeft']) {
                player.vx -= 1;
                player.facing = -1;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                player.vx += 1;
                player.facing = 1;
            }
            
            // Прыжок
            if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }
            
            // Атака
            if (keys['KeyZ'] && !player.attacking) {
                player.attacking = true;
                player.attackTimer = 15;
            }
            
            if (player.attacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) {
                    player.attacking = false;
                }
            }
            
            // Физика
            player.vx *= FRICTION;
            player.vy += GRAVITY;
            
            player.x += player.vx;
            player.y += player.vy;
            
            // Ограничения
            if (player.x < 50) player.x = 50;
            if (player.x > canvas.width - 50) player.x = canvas.width - 50;
            
            // Пол
            if (player.y + player.height / 2 >= GROUND_Y) {
                player.y = GROUND_Y - player.height / 2;
                player.vy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }
            
            // Здоровье
            if (player.health <= 0) {
                player.health = 0;
                gameOver();
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(player.facing, 1);
            
            // Длинная прямоугольная накидка
            ctx.fillStyle = player.cloakColor;
            ctx.fillRect(-15, -20, 30, 80);
            
            // Края накидки
            ctx.strokeStyle = '#2d4a2d';
            ctx.lineWidth = 2;
            ctx.strokeRect(-15, -20, 30, 80);
            
            // Голова/маска
            ctx.fillStyle = '#c0c0c0';
            ctx.beginPath();
            ctx.ellipse(0, -25, 12, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Глаза маски
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(-4, -27, 4, 6, 0, 0, Math.PI * 2);
            ctx.ellipse(4, -27, 4, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Руки с гвоздём (оружие)
            if (player.attacking) {
                ctx.fillStyle = '#888';
                ctx.fillRect(15, -10, 50, 8);
                ctx.fillStyle = '#666';
                ctx.fillRect(65, -12, 10, 12);
            } else {
                ctx.fillStyle = '#3d5c3d';
                ctx.fillRect(-5, -5, 20, 6);
            }
            
            ctx.restore();
        }

        function drawBackground() {
            // Фон - свалище
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a2e1a');
            gradient.addColorStop(1, '#2d3a2d');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Пол
            ctx.fillStyle = '#3a4a3a';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            
            // Детали пола
            ctx.fillStyle = '#4a5a4a';
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.fillRect(i, GROUND_Y, 40, 10);
            }
            
            // Прутья арены (без имени)
            ctx.strokeStyle = '#5a5a5a';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            
            // Левая стена
            ctx.beginPath();
            ctx.moveTo(100, GROUND_Y);
            ctx.lineTo(100, 100);
            ctx.stroke();
            
            // Правая стена
            ctx.beginPath();
            ctx.moveTo(canvas.width - 100, GROUND_Y);
            ctx.lineTo(canvas.width - 100, 100);
            ctx.stroke();
            
            // Вертикальные прутья
            for (let i = 0; i <= 10; i++) {
                const x = 100 + (i * (canvas.width - 200) / 10);
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x, 100);
                ctx.stroke();
            }
            
            // Горизонтальные связи
            for (let y = 150; y < GROUND_Y; y += 100) {
                ctx.beginPath();
                ctx.moveTo(100, y);
                ctx.lineTo(canvas.width - 100, y);
                ctx.stroke();
            }
            
            // Задний план - силуэты мешков
            ctx.fillStyle = '#1a2e1a';
            for (let i = 0; i < 15; i++) {
                const bx = i * 80 - 20;
                const by = GROUND_Y - 30 - Math.sin(i * 1.5) * 20;
                ctx.beginPath();
                ctx.arc(bx, by, 40 + Math.sin(i) * 10, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawUI() {
            // Здоровье игрока
            ctx.fillStyle = '#333';
            ctx.fillRect(20, 20, 200, 20);
            ctx.fillStyle = '#c03030';
            ctx.fillRect(20, 20, player.health * 2, 20);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, 200, 20);
            
            ctx.fillStyle = '#fff';
            ctx.font = '14px Georgia';
            ctx.fillText(`${player.name}: ${Math.floor(player.health)}/${player.maxHealth}`, 25, 35);
            
            // Информация о волне
            ctx.fillStyle = '#fff';
            ctx.font = '16px Georgia';
            ctx.fillText(`Волна: ${wave}/3`, canvas.width - 120, 40);
            
            // Надпись в левом нижнем углу при появлении босса
            if (boss && boss.enterTimer < 30) {
                ctx.fillStyle = '#8fbc8f';
                ctx.font = 'bold 24px Georgia';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 10;
                ctx.fillText('драная легкомаска', 30, canvas.height - 50);
                ctx.shadowBlur = 0;
            }
        }

        function updateWave() {
            if (boss) {
                boss.update();
                return;
            }
            
            // Спавн мешков
            if (bagsSpawned < 3 + wave * 2 && Math.random() < 0.02) {
                spawnBag();
            }
            
            // Проверка завершения волны
            if (bags.every(b => b.opened) && enemies.length === 0 && !bossSpawned) {
                if (wave < 3) {
                    wave++;
                    bags = [];
                    bagsSpawned = 0;
                } else {
                    // Спавн босса
                    boss = new Lightmask();
                    bossSpawned = true;
                }
            }
            
            // Обновление мешков
            bags.forEach(bag => bag.update());
            
            // Обновление врагов
            enemies.forEach(enemy => enemy.update());
        }

        function victory() {
            gameState = 'credits';
            credits.style.display = 'flex';
            
            setTimeout(() => {
                credits.style.display = 'none';
                resetArena();
                gameState = 'playing';
            }, 5000);
        }

        function gameOver() {
            gameState = 'start';
            startScreen.style.display = 'flex';
            document.querySelector('#startScreen h1').textContent = 'ИГРА ОКОНЧЕНА';
            document.querySelector('#startScreen p:last-child').textContent = 'Попробуй снова!';
        }

        function gameLoop() {
            if (gameState !== 'playing') {
                if (gameState === 'playing') requestAnimationFrame(gameLoop);
                return;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка фона
            drawBackground();
            
            // Обновление и отрисовка
            updatePlayer();
            updateWave();
            checkCollisions();
            
            // Отрисовка мешков
            bags.forEach(bag => bag.draw());
            
            // Отрисовка врагов
            enemies.forEach(enemy => enemy.draw());
            
            // Отрисовка босса
            if (boss) {
                boss.draw();
            }
            
            // Отрисовка снарядов
            ctx.fillStyle = '#8fbc8f';
            projectiles.forEach(proj => {
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Отрисовка частиц
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                
                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            
            // Отрисовка игрока
            drawPlayer();
            
            // UI
            drawUI();
            
            requestAnimationFrame(gameLoop);
        }

        // Начальная отрисовка фона
        drawBackground();
    </script>
</body>
</html>
